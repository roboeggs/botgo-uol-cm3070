greeting:
  other: |
    👋 <b>Привет, {{.Name}}!</b>

    Я показываю активные уровни поддержки и сопротивления на крипторынке и умею анализировать их с помощью AI.

    <b>Как пользоваться:</b>

    📊 <b>Рынок</b> — список всех активных монет с поиском и фильтрами
    ⭐ <b>Избранное</b> — твои монеты под рукой
    🔍 <b>Скринер</b> — обзор рынка и графики
    ⚙️ <b>Настройки</b> — смена языка

    <b>Можно просто написать тикер</b> — например <code>BTC</code>, <code>SUI</code> или <code>ETHUSDT</code> — и я пришлю карточку с уровнями.

    <b>AI-анализ:</b> команда <code>/ai</code> + вопрос.
    Примеры:
    • <code>/ai расскажи про BTCUSDT</code>
    • <code>/ai что сейчас интересного?</code>
    • <code>/ai сравни BTC и ETH</code>

    Начни с кнопки <b>📊 Рынок</b> ниже или напиши тикер прямо сейчас.


help_message:
  other: |
    <b>🤖 Помощь</b>

    <b>Основные действия:</b>
    • <b>Напиши тикер</b> — например <code>BTC</code>, <code>SUI</code> или <code>ETHUSDT</code> — пришлю карточку с активными уровнями поддержки и сопротивления.
    • <b>📊 Рынок</b> — открыть список всех монет с активными уровнями. Внутри есть поиск, фильтры и сортировка.
    • <b>⭐ Избранное</b> — твои сохранённые монеты. Добавить в избранное можно из карточки тикера.
    • <b>🔍 Скринер</b> — обзор рынка и графики.
    • <b>⚙️ Настройки</b> — смена языка интерфейса.

    <b>Команды:</b>
    /start — начать работу, показать клавиатуру
    /help — эта справка
    /db <code>&lt;ТИКЕР&gt;</code> — карточка тикера (то же, что просто написать тикер)
    /db_tickers — список всех активных монет
    /ai <code>&lt;вопрос&gt;</code> — AI-анализ рынка

    <b>Примеры AI-запросов:</b>
    • <code>/ai расскажи про BTCUSDT</code>
    • <code>/ai что сейчас интересного?</code>
    • <code>/ai сравни BTC и ETH</code>
    • <code>/ai что такое RSI?</code>

    <b>Про уровни:</b>
    🟢 <b>Поддержка</b> — цена ниже текущей, куда цена может откатиться и отскочить.
    🔴 <b>Сопротивление</b> — цена выше текущей, где возможен откат вниз.
    Чем больше касаний и чем свежее последнее — тем сильнее уровень.
    

