greeting:
  other: |
    👋 <b>Hi, {{.Name}}!</b>

    I show active support and resistance levels on crypto markets and can analyze them with AI.

    <b>How to use:</b>

    📊 <b>Market</b> — list of all active coins with search and filters
    ⭐ <b>Favorites</b> — your coins at hand
    🔍 <b>Screener</b> — market overview and charts
    ⚙️ <b>Settings</b> — language

    <b>Just type a ticker</b> — e.g. <code>BTC</code>, <code>SUI</code> or <code>ETHUSDT</code> — and I'll send a level card.

    <b>AI analysis:</b> command <code>/ai</code> + your question.
    Examples:
    • <code>/ai tell me about BTCUSDT</code>
    • <code>/ai what's interesting right now?</code>
    • <code>/ai compare BTC and ETH</code>

    Start with <b>📊 Market</b> below or type a ticker right now.

help_message:
  other: |
    <b>🤖 Help</b>

    <b>Main actions:</b>
    • <b>Type a ticker</b> — e.g. <code>BTC</code>, <code>SUI</code> or <code>ETHUSDT</code> — I'll send a card with active support/resistance levels.
    • <b>📊 Market</b> — list of all coins with active levels. Search, filters and sorting inside.
    • <b>⭐ Favorites</b> — your saved coins. Add a coin from its ticker card.
    • <b>🔍 Screener</b> — market overview and charts.
    • <b>⚙️ Settings</b> — interface language.

    <b>Commands:</b>
    /start — start, show keyboard
    /help — this help
    /db <code>&lt;TICKER&gt;</code> — ticker card (same as just typing the ticker)
    /db_tickers — list of all active coins
    /ai <code>&lt;question&gt;</code> — AI market analysis

    <b>AI examples:</b>
    • <code>/ai tell me about BTCUSDT</code>
    • <code>/ai what's interesting right now?</code>
    • <code>/ai compare BTC and ETH</code>
    • <code>/ai what is RSI?</code>

    <b>About levels:</b>
    🟢 <b>Support</b> — below current price, where price may bounce up.
    🔴 <b>Resistance</b> — above current price, where price may pull back down.
    More touches + more recent last touch = stronger level.

